apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    purpose: taint
    project: roboshop
spec:
  replicas: 3
  selector:
    matchLabels:
      purpose: taint
      project: roboshop
  template:
    metadata:
      labels:
        purpose: taint
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: nginx