apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    purpose: taint
    project: roboshop
spec:
  replicas: 3
  selector:
    matchLabels:
      purpose: taint
      project: roboshop
  template:
    metadata:
      labels:
        purpose: taint
        project: roboshop
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-30-173.ec2.internal 
      containers:
      - name: nginx
        image: nginx
      tolerations:
      - key: "project"
        operator: "Equal"
        value: "roboshop"
        effect: "NoSchedule"